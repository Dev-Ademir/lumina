        function App() {
            const [activeCategory, setActiveCategory] = useState('todos');
            const [bookingModalOpen, setBookingModalOpen] = useState(false);
            const [selectedService, setSelectedService] = useState(null);
            const [bookingSuccess, setBookingSuccess] = useState(false);
            const [notification, setNotification] = useState('');

            // [FIX 6] Estado de envio para desabilitar botão e evitar duplo clique
            const [isSubmittingBooking, setIsSubmittingBooking] = useState(false);
            const [isSubmittingContact, setIsSubmittingContact] = useState(false);

            // [FIX 7] Estado controlado do formulário de contato rápido
            const [contactForm, setContactForm] = useState({
                name: '',
                phone: '',
                category: 'masculino',
                message: ''
            });

            // Form state for scheduling
            const [formData, setFormData] = useState({
                name: '',
                phone: '',
                category: 'masculino',
                serviceId: 'm1',
                artist: '',
                date: '',
                time: '14:00',
                notes: ''
            });

            // [FIX 5] Refs para cleanup de timers (evita memory leak e callbacks órfãos)
            const toastTimerRef = React.useRef(null);
            const bookingTimersRef = React.useRef([]);

            // [FIX 5] Cleanup de todos os timers ao desmontar
            useEffect(() => {
                return () => {
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                    bookingTimersRef.current.forEach(t => clearTimeout(t));
                    bookingTimersRef.current = [];
                };
            }, []);

            // Filtered services
            const currentServices = useMemo(() => {
                if (activeCategory === 'todos') {
                    return CATEGORIES.flatMap(cat =>
                        cat.services.map(s => ({ ...s, catId: cat.id, catName: cat.name, catColors: cat.colors }))
                    );
                }
                const found = CATEGORIES.find(c => c.id === activeCategory);
                return found ? found.services.map(s => ({ ...s, catId: found.id, catName: found.name, catColors: found.colors })) : [];
            }, [activeCategory]);

            // [FIX 12] Se não vier serviço, seleciona o primeiro serviço da categoria alvo
            // para manter formData.serviceId e selectedService sempre coerentes.
            // [FIX 2] Aceita artistName para registrar com quem é o agendamento.
            const handleOpenBooking = (service = null, catId = null, artistName = '') => {
                if (service) {
                    setSelectedService(service);
                    setFormData(prev => ({
                        ...prev,
                        category: catId || service.catId || 'masculino',
                        serviceId: service.id,
                        artist: artistName || ''
                    }));
                } else {
                    // Sem serviço explícito: ancora na categoria e no primeiro serviço dela
                    const targetCatId = catId || 'masculino';
                    const targetCat = CATEGORIES.find(c => c.id === targetCatId) || CATEGORIES[0];
                    const firstService = targetCat.services[0];
                    setSelectedService(firstService);
                    setFormData(prev => ({
                        ...prev,
                        category: targetCat.id,
                        serviceId: firstService.id,
                        artist: artistName || ''
                    }));
                }
                setBookingSuccess(false);
                setIsSubmittingBooking(false);
                setBookingModalOpen(true);
            };
            // [FIX 4] Garante que a mensagem sempre use o título legível do serviço
            // [FIX 6] window.open disparado no clique (não em setTimeout) para não ser bloqueado
            // [FIX 14] Abre o WhatsApp imediatamente; os timers só cuidam da UI de feedback
            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (isSubmittingBooking) return;

                // Resolve o serviço de forma robusta: estado > seleção > primeiro da categoria
                const cat = CATEGORIES.find(c => c.id === formData.category) || CATEGORIES[0];
                const svc = selectedService
                    || cat.services.find(s => s.id === formData.serviceId)
                    || cat.services[0];

                const dateLabel = formData.date || 'Data a combinar';
                const artistLine = formData.artist ? `\n- Especialista: ${formData.artist}` : '';
                const message = encodeURIComponent(
                    `Olá LUMINA Studio! Gostaria de confirmar meu agendamento:\n` +
                    `- Cliente: ${formData.name}\n` +
                    `- Telefone: ${formData.phone}\n` +
                    `- Serviço: ${svc.title}` +
                    artistLine +
                    `\n- Data: ${dateLabel} às ${formData.time}` +
                    (formData.notes ? `\n- Observações: ${formData.notes}` : '')
                );
                const whatsappUrl = `https://wa.me/5511999999999?text=${message}`;

                // Abre o WhatsApp imediatamente (dentro do gesto do usuário → não bloqueado)
                window.open(whatsappUrl, '_blank', 'noopener,noreferrer');

                setIsSubmittingBooking(true);
                setBookingSuccess(true);
                setNotification('Agendamento pré-confirmado! Abrimos o WhatsApp em nova aba.');

                // [FIX 5] Timers rastreados para cleanup
                const t1 = setTimeout(() => {
                    setBookingModalOpen(false);
                    setBookingSuccess(false);
                    setIsSubmittingBooking(false);
                    setNotification('');
                }, 1800);
                bookingTimersRef.current.push(t1);
            };

            // [FIX 5] Toast com timer rastreado (evita acúmulo e callbacks órfãos)
            const showToast = (text) => {
                setNotification(text);
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => {
                    setNotification('');
                    toastTimerRef.current = null;
                }, 3500);
            };

            return (

                                                        onChange={(e) => setFormData({ ...formData, time: e.target.value })}
                                                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-amber-400"
                                                    >
                                                        <option value="09:00">09:00</option>
                                                        <option value="11:00">11:00</option>
                                                        <option value="14:00">14:00</option>
                                                        <option value="16:30">16:30</option>
                                                        <option value="18:30">18:30</option>
                                                        <option value="19:30">19:30</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="pt-3">
                                                <button
                                                    type="submit"
                                                    disabled={isSubmittingBooking}
                                                    className="w-full py-3.5 rounded-xl font-bold uppercase tracking-wider text-xs bg-gradient-to-r from-amber-400 via-amber-500 to-amber-400 hover:opacity-95 text-neutral-950 shadow-xl shadow-amber-500/20 active:scale-95 transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
                                                >
                                                    <IconCalendar className="w-4 h-4" />
                                                    {isSubmittingBooking ? 'Abrindo WhatsApp...' : 'Finalizar Reserva pelo WhatsApp'}
                                                </button>
                                            </div>

                                            <p className="text-[10px] text-center text-slate-400 mt-2">
                                                * Sem cobrança antecipada. O pagamento é realizado no estúdio após sua total satisfação.
                                            </p>
                                        </form>
                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
